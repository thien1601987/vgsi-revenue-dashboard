<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#123047">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Dashboard Doanh thu & Dòng tiền — VGSI PILE</title>

  <style>
    :root { --brand: #123047; --brand-2: #1e4a6b; --brand-3: #2e6188; }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: #eef3f8;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;          /* 100dvh: đúng khi thanh địa chỉ mobile ẩn/hiện */
    }

    /* ---------- HEADER ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: var(--brand);
      color: #fff;
      padding-top: calc(12px + env(safe-area-inset-top));         /* tai thỏ iPhone */
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }

    header h1 { margin: 0; font-size: 19px; line-height: 1.25; }
    header .sub { margin: 3px 0 0; font-size: 12px; opacity: 0.78; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 13px; border-radius: 8px;
      font-size: 13px; text-decoration: none; cursor: pointer;
      background: var(--brand-2); color: #e3f1ff;
      border: 1px solid var(--brand-3);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: #256a94; }
    .btn.ghost { background: transparent; color: #cfe6ff; }

    /* ---------- NỘI DUNG ---------- */
    main {
      flex: 1 1 auto;
      padding: 10px;
      min-height: 55vh;
      display: flex;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
    }

    .hint {
      display: none;
      padding: 8px 14px 0;
      color: #43607a;
      font-size: 12px;
      line-height: 1.4;
    }

    footer {
      padding: 6px 16px calc(8px + env(safe-area-inset-bottom));
      font-size: 11px;
      color: #6b8299;
      text-align: right;
    }

    /* ---------- MOBILE ---------- */
    @media (max-width: 640px) {
      header { padding: 10px 12px; gap: 8px; padding-top: calc(10px + env(safe-area-inset-top)); }
      header h1 { font-size: 16px; }
      header .sub { font-size: 11px; }
      .btn { padding: 8px 11px; font-size: 12px; }
      main { padding: 6px; }
      iframe { border-radius: 8px; }
      .hint { display: block; }
      footer { text-align: center; }
    }

    /* Điện thoại nằm ngang: ưu tiên chỗ cho bảng, bỏ gợi ý */
    @media (orientation: landscape) and (max-height: 520px) {
      .hint { display: none; }
      header h1 { font-size: 15px; }
      header .sub { display: none; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>BẢNG DOANH THU &amp; DÒNG TIỀN</h1>
      <p class="sub">Dữ liệu trực tiếp từ Excel Online · tự cập nhật 5 phút</p>
    </div>

    <div class="actions">
      <a class="btn" id="openExcel" target="_blank" rel="noopener">📊 Mở Excel đầy đủ ↗</a>
      <button class="btn ghost" id="refresh" type="button">↻ Tải lại</button>
    </div>
  </header>

  <p class="hint">📱 <b>Trên điện thoại:</b> xoay ngang để xem bảng rộng hơn · dùng 2 ngón để phóng to/thu nhỏ · nếu bảng khó thao tác, bấm <b>“Mở Excel đầy đủ”</b>.</p>

  <main>
    <iframe
      id="excelDashboard"
      title="Dashboard doanh thu và dòng tiền"
      loading="lazy"
      allowfullscreen
      src="https://vgsipile-my.sharepoint.com/personal/thanhthien_vgsipile_com/_layouts/15/Doc.aspx?sourcedoc={77d3dcab-5b28-41b6-8016-094a54b7ef2c}&action=embedview&wdAllowInteractivity=True&wdHideGridlines=True&wdHideHeaders=True&wdHideSheetTabs=True&wdDownloadButton=False&ActiveCell=Dashboard!A1">
    </iframe>
  </main>

  <footer id="stamp">Đang tải…</footer>

  <script>
    const EMBED_URL = "https://vgsipile-my.sharepoint.com/personal/thanhthien_vgsipile_com/_layouts/15/Doc.aspx?sourcedoc={77d3dcab-5b28-41b6-8016-094a54b7ef2c}&action=embedview&wdAllowInteractivity=True&wdHideGridlines=True&wdHideHeaders=True&wdHideSheetTabs=True&wdDownloadButton=False&ActiveCell=Dashboard!A1";

    const frame = document.getElementById("excelDashboard");
    const stamp = document.getElementById("stamp");

    // Nút "Mở Excel đầy đủ": mở bản Excel Online toàn trang (dễ thao tác trên mobile)
    document.getElementById("openExcel").href = EMBED_URL;

    function reloadFrame() {
      const url = new URL(EMBED_URL);
      url.searchParams.set("_refresh", Date.now());   // phá cache, lấy dữ liệu đã lưu mới nhất
      frame.src = url.toString();
      stamp.textContent = "Cập nhật lúc " + new Date().toLocaleTimeString("vi-VN");
    }

    // Tự tải lại mỗi 5 phút
    setInterval(reloadFrame, 5 * 60 * 1000);

    document.getElementById("refresh").addEventListener("click", reloadFrame);

    // Khi quay lại tab (điện thoại hay bị treo nền) → làm mới nếu đã quá 5 phút
    let last = Date.now();
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && Date.now() - last > 5 * 60 * 1000) {
        last = Date.now();
        reloadFrame();
      }
    });

    window.addEventListener("load", () => { last = Date.now(); reloadFrame(); });
  </script>
</body>
</html>
